  <script>
    (function () {
      // ---- 곡선 (motion.md 1장) ----
      function bez(x1, y1, x2, y2) {
        return function (x) {
          if (x <= 0) return 0; if (x >= 1) return 1;
          let lo = 0, hi = 1, t = x;
          for (let i = 0; i < 60; i++) {
            t = (lo + hi) / 2;
            const cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
            if (cx < x) lo = t; else hi = t;
          }
          return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
        };
      }
      const curveEnter = bez(0, 0, 0.3, 1);   // curve-enter
      const curveExit = bez(0.4, 0.14, 1, 1); // curve-exit
      const prog = (f, start, dur, curve) => curve((f - start) / dur);
      const enterP = (f, start) => prog(f, start, 6, curveEnter);    // motion-enter = duration-6 · curve-enter · 크기 0 → 1
      const exitOp = (f, start) => 1 - prog(f, start, 4, curveExit); // motion-exit = duration-4 · curve-exit (불투명 → 투명)
      const $ = id => document.getElementById(id);

      // 글자 타자 (motion.md 3장): 글자 등장 0f · 간격 hold-tick(4f). 띄어쓰기는 세지 않고 다음 글자와 함께 나온다
      function typed(text, start, f) {
        if (f < start) return '';
        const n = Math.floor((f - start) / 4) + 1; // hold-tick
        let out = '', k = 0;
        for (const ch of text) {
          if (ch === ' ') { out += ch; continue; }
          if (k >= n) break;
          out += ch; k++;
        }
        return out.replace(/ +$/, '');
      }
      const TOP = '이번 달 미션,', L2 = '적용 사례 정리하기', L3 = '내 자산에 등록됐어요';

      function rollState(f) {
        $('end-top').textContent = typed(TOP, 358, f);        // ① 358 · 362 · … · 378
        const line = $('end-line'); line.style.opacity = 1;
        if (f < 446) {
          line.textContent = typed(L2, 390, f);                // ② hold-glance 378–390 → 390 · … · 418 → hold-read 418–442
          if (f >= 442) line.style.opacity = exitOp(f, 442);   // 아랫줄 motion-exit 442–446
        } else {
          line.textContent = typed(L3, 446, f);                // ③ 446 · … · 478 → hold-read 478–502
        }
      }

      const START = 352, END = 556; // S11 시작 ~ S13 끝
      function render(f) {
        $('end-bg').style.opacity = f < 358 ? prog(f, 352, 6, curveEnter) : 1; // S11 바탕 투명 → 불투명만 (duration-6 · curve-enter)
        const roll = $('end-roll-layer'), card = $('end-card-layer');
        if (f < 358) { roll.style.display = 'none'; card.style.display = 'none'; return; } // S11: 글자 없음
        if (f < 506) { roll.style.display = 'flex'; rollState(Math.min(f, 501)); roll.style.opacity = f >= 502 ? exitOp(f, 502) : 1; } // S12 두 줄 motion-exit 502–506
        else roll.style.display = 'none';
        if (f >= 502) { // S13 (502 · 54, 미리보기): motion-enter 502–508 → 머묾 508–556 (48f = hold-screen)
          card.style.display = 'flex';
          const p = enterP(f, 502); $('end-card').style.opacity = p; $('end-card').style.transform = `scale(${p})`;
        } else card.style.display = 'none';
      }

      function build() {
        const clock = { get f() { return this._f; }, set f(v) { this._f = v; render(Math.round(v * 1000) / 1000); }, _f: START };
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(clock, { f: START }, { f: END, duration: (END - START) / 30, ease: 'none' }, 0); // 30fps
        render(START);
        window.__timelines["end"] = tl;
      }
      document.fonts.ready.then(build);
    })();
  </script>
